[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "killswitch"
version = "0.1.3"
description = "This package has moved to killswitch-ai. Please run: pip install killswitch-ai"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "killswitch-ai" }]
dependencies = ["killswitch-ai>=0.1.3"]

[project.urls]
Homepage = "https://pypi.org/project/killswitch-ai/"

[tool.hatch.build.targets.wheel]
packages = ["src/killswitch_stub"]
