kind = "web"
previewPath = "/"
title = "killswitch-ai — LLM Egress Control"
version = "1.0.0"
id = "artifacts/killswitch-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22334

[services.development]
run = "pnpm --filter @workspace/killswitch-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/killswitch-site", "run", "build" ]
publicDir = "artifacts/killswitch-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22334"
BASE_PATH = "/"
