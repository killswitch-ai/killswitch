openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: telemetry
    description: Anonymous usage telemetry
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /telemetry/recent:
    get:
      operationId: getRecentTelemetry
      tags: [telemetry]
      summary: Get recent anonymized threat detections
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
          required: false
          description: Number of recent events to return
      responses:
        "200":
          description: Recent anonymized telemetry events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentTelemetryFeed"

  /telemetry:
    post:
      operationId: submitTelemetry
      tags: [telemetry]
      summary: Submit anonymous usage telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryReport"
      responses:
        "201":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryRecord"
        "400":
          description: Invalid report body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: getTelemetryStats
      tags: [telemetry]
      summary: Get aggregate telemetry statistics
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CountMap:
      type: object
      additionalProperties:
        type: integer

    TelemetryReport:
      type: object
      required:
        - install_id
        - commands_analyzed
        - prohibited_stopped
        - sensitive_stopped
      properties:
        install_id:
          type: string
        lib_version:
          type: string
          nullable: true
        python_version:
          type: string
          nullable: true
        os_type:
          type: string
          nullable: true
        commands_analyzed:
          type: integer
        prohibited_stopped:
          type: integer
        sensitive_stopped:
          type: integer
        agents:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        providers:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        modes:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        finding_types:
          type: object
          nullable: true
          additionalProperties:
            type: integer

    TelemetryRecord:
      type: object
      required:
        - id
        - install_id
        - reported_at
        - commands_analyzed
        - prohibited_stopped
        - sensitive_stopped
      properties:
        id:
          type: integer
        install_id:
          type: string
        reported_at:
          type: string
          format: date-time
        lib_version:
          type: string
          nullable: true
        python_version:
          type: string
          nullable: true
        os_type:
          type: string
          nullable: true
        commands_analyzed:
          type: integer
        prohibited_stopped:
          type: integer
        sensitive_stopped:
          type: integer
        agents:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        providers:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        modes:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        finding_types:
          type: object
          nullable: true
          additionalProperties:
            type: integer

    TelemetryStats:
      type: object
      required:
        - total_reports
        - total_commands_analyzed
        - total_prohibited_stopped
        - total_sensitive_stopped
      properties:
        total_reports:
          type: integer
        total_commands_analyzed:
          type: integer
        total_prohibited_stopped:
          type: integer
        total_sensitive_stopped:
          type: integer
        top_agents:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        top_providers:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        top_finding_types:
          type: object
          nullable: true
          additionalProperties:
            type: integer

    RecentTelemetryEvent:
      type: object
      required:
        - finding_type
        - mode
        - reported_at
      properties:
        finding_type:
          type: string
          description: Type of finding detected (e.g. aws_key, pii, generic_secret)
        mode:
          type: string
          description: Mode that was triggered (kill, redact, pause, report_only)
        reported_at:
          type: string
          format: date-time

    RecentTelemetryFeed:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/RecentTelemetryEvent"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
