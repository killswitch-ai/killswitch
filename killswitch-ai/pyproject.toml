[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "killswitch"
version = "0.1.2"
description = "Local LLM egress control — stop secrets before they reach the LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "killswitch-ai" }]
keywords = ["llm", "security", "openai", "anthropic", "egress", "dlp", "secrets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
all = ["openai>=1.0", "anthropic>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "openai>=1.0",
    "anthropic>=0.20",
]

[project.scripts]
killswitch = "killswitch.cli.main:main"

[project.urls]
Homepage = "https://github.com/killswitch-ai/killswitch-ai"
Documentation = "https://killswitch-ai.dev"
"Bug Tracker" = "https://github.com/killswitch-ai/killswitch-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/killswitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
